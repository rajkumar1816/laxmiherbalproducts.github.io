<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Lakshmi Herbal Products</title>
    <link rel="stylesheet" href="admin-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Login Modal -->
    <div id="loginModal" class="modal active">
        <div class="modal-content">
            <div class="logo">
                <i class="fas fa-leaf"></i>
                Admin Panel
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                <div class="default-creds">
                    <small>Default: admin / admin123</small>
                </div>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" class="admin-dashboard hidden">
        <!-- Header -->
        <header class="admin-header">
            <div class="admin-nav">
                <div class="logo">
                    <i class="fas fa-leaf"></i>
                    Lakshmi Admin
                </div>
                <div class="admin-actions">
                    <button id="logoutBtn" class="btn btn-secondary">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="admin-main">
            <!-- Products Management -->
            <section class="admin-section">
                <h2><i class="fas fa-box"></i> Manage Products</h2>
                
                <!-- Add Product Form -->
                <div class="form-container">
                    <h3>Add/Edit Product</h3>
                    <form id="productForm" enctype="multipart/form-data">
                        <input type="hidden" id="productId">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Name</label>
                                <input type="text" id="productName" required>
                            </div>
                            <div class="form-group">
                                <label>Price</label>
                                <input type="text" id="productPrice" placeholder="₹299" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="productDesc" rows="3" required></textarea>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Image</label>
                                <input type="file" id="productImage" accept="image/*">
                            </div>
                            <div class="form-group">
                                <label>Category</label>
                                <select id="productCategory">
                                    <option value="hair-oil">Hair Oil</option>
                                    <option value="powder">Hair Powder</option>
                                    <option value="combo">Combo</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Save Product
                            </button>
                            <button type="button" id="clearFormBtn" class="btn btn-secondary">
                                Clear Form
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Products List -->
            <section class="admin-section">
                <div class="table-container">
                    <table id="productsTable">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Price</th>
                                <th>Description</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody">
                            <!-- Products loaded here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="admin-script.js"></script>
</body>
</html>
